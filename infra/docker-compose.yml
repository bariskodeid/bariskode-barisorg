# Stack infrastruktur bariskode.org — dipakai untuk DUA hal berbeda:
#
# 1. Local dev (docs/07-LOCAL-DEVELOPMENT.md): jalankan service satu-satu
#    sesuai kebutuhan (`docker compose up -d postgres`, dst) — `pnpm dev`
#    tetap jalan di host, BUKAN di container `web`.
# 2. Production (docs/14-DEPLOYMENT-ORACLE-VM.md): `docker compose up -d
#    --build` menjalankan SEMUANYA termasuk `web` & `caddy`, satu-satunya
#    yang publish port ke internet (80/443).
#
# Fase 0: `postgres`. Fase 5: Judge0 (docs/11-FEATURE-CODE-SANDBOX.md).
# Fase 6: CTFd (docs/12-FEATURE-CYBERSECURITY-LABS.md). Fase 7: `web` & `caddy`.
#
# PENTING: judge0-server & judge0-workers butuh `privileged: true` (dipakai
# oleh sandbox "isolate" milik Judge0 untuk isolasi proses per-submission).
# Kalau environment kamu tidak mengizinkan privileged container (mis. runner
# CI/sandbox tertentu), service ini tidak akan bisa start — itu batasan
# lingkungan, bukan bug konfigurasi.
#
# Secret CTFd (CTFD_SECRET_KEY, CTFD_DB_USER/PASSWORD/NAME) sengaja diisi di
# infra/.env (bukan file .env.ctfd terpisah seperti disebut
# docs/05-REPO-STRUCTURE.md) — DATABASE_URL service `ctfd` butuh password yang
# sama persis dengan MARIADB_PASSWORD di service `ctfd-db`, dan docker compose
# cuma bisa interpolasi ${VAR} dari .env di root project, bukan dari env_file
# service lain.
#
# `mem_limit` di tiap service sengaja diisi (bukan default) untuk aman jalan
# di VM 4GB RAM: total hard limit semua service ~3.1GB, sisa ~0.9GB untuk
# OS/Docker daemon. Ini cgroup memory limit biasa (bukan `deploy.resources`,
# yang cuma dipakai Swarm) — kalau container kena limit, HANYA container itu
# yang di-OOM-kill oleh kernel, bukan proses lain di host. Kalau VM kamu
# >= 8GB RAM, angka-angka ini boleh dihapus/dinaikkan — lihat catatan resource
# di docs/14-DEPLOYMENT-ORACLE-VM.md. Untuk RAM sekecil ini, jalankan juga
# `infra/setup-swap.sh` sebagai jaring pengaman tambahan (bukan pengganti).

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 400m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bariskode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: ${POSTGRES_DB:-bariskode}
    ports:
      # 127.0.0.1 saja — cukup buat `pnpm dev` di host reach lewat localhost,
      # tidak reachable dari luar VM sekalipun kalau firewall salah setting
      # (defense-in-depth, lihat docs/16-SECURITY-CHECKLIST.md).
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bariskode}']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Judge0 (code sandbox, Fase 5) ---
  # Konfigurasi lengkap ada di infra/judge0/judge0.conf (salin dari
  # judge0.conf.example, isi secret-nya — lihat file itu untuk detail).
  judge0-server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    # 127.0.0.1 saja — lihat catatan di service `postgres`.
    ports:
      - '127.0.0.1:${JUDGE0_PORT:-2358}:2358'
    privileged: true
    restart: unless-stopped
    mem_limit: 200m
    <<: *default-logging

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ['./scripts/workers']
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    # 700m: proses worker Rails + isolate cgroup per eksekusi (MEMORY_LIMIT
    # di judge0.conf 128000KB ~125MB) + overhead. Dengan COUNT=1 di
    # judge0.conf (diturunkan dari default 2 untuk RAM 4GB), cukup untuk satu
    # eksekusi bersamaan.
    mem_limit: 700m
    <<: *default-logging

  judge0-db:
    # Postgres versi sama dengan service `postgres` utama di atas, bukan
    # 16.2 spesifik seperti docker-compose.yml resmi Judge0 — lebih mudah
    # dirawat & tidak menambah image terpisah untuk versi patch yang sama.
    image: postgres:16-alpine
    env_file: ./judge0/judge0.conf
    volumes:
      - judge0_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 200m
    <<: *default-logging

  judge0-redis:
    image: redis:7.2.4
    command: ['bash', '-c', 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: ./judge0/judge0.conf
    restart: unless-stopped
    mem_limit: 48m
    <<: *default-logging

  # --- CTFd (lab cybersecurity, Fase 6) ---
  # Aplikasi & auth terpisah sepenuhnya dari Payload — lihat
  # docs/12-FEATURE-CYBERSECURITY-LABS.md soal alasan kenapa dipisah.
  ctfd:
    image: ctfd/ctfd:3.8.7
    restart: unless-stopped
    environment:
      UPLOAD_FOLDER: /var/uploads
      DATABASE_URL: mysql+pymysql://${CTFD_DB_USER:-ctfd}:${CTFD_DB_PASSWORD:-CHANGE_ME}@ctfd-db/${CTFD_DB_NAME:-ctfd}
      REDIS_URL: redis://ctfd-redis:6379
      SECRET_KEY: ${CTFD_SECRET_KEY:-CHANGE_ME_random_string}
      WORKERS: 1
      REVERSE_PROXY: 'true'
    # 127.0.0.1 saja — lihat catatan di service `postgres`.
    ports:
      - '127.0.0.1:${CTFD_PORT:-8000}:8000'
    volumes:
      - ctfd_uploads:/var/uploads
      - ctfd_logs:/var/log/CTFd
    depends_on:
      - ctfd-db
      - ctfd-redis
    mem_limit: 400m
    <<: *default-logging

  ctfd-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${CTFD_DB_PASSWORD:-CHANGE_ME}
      MARIADB_USER: ${CTFD_DB_USER:-ctfd}
      MARIADB_PASSWORD: ${CTFD_DB_PASSWORD:-CHANGE_ME}
      MARIADB_DATABASE: ${CTFD_DB_NAME:-ctfd}
    volumes:
      - ctfd_db_data:/var/lib/mysql
    command:
      [
        'mysqld',
        '--character-set-server=utf8mb4',
        '--collation-server=utf8mb4_unicode_ci',
        '--wait_timeout=28800',
        '--log-warnings=0',
      ]
    mem_limit: 400m
    <<: *default-logging

  # Redis modern (bukan redis:4 seperti docker-compose.yml resmi CTFd —
  # sudah EOL & tidak ada alasan kuat memakainya di sini).
  ctfd-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ctfd_redis_data:/data
    mem_limit: 48m
    <<: *default-logging

  # --- Aplikasi utama & reverse proxy (Fase 7, production only) ---
  # Tidak dipakai saat local dev — `pnpm dev` di host sudah menjalankan ini.
  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    env_file: ../apps/web/.env
    depends_on:
      - postgres
    expose:
      - '3000'
    mem_limit: 600m
    <<: *default-logging

  # Jalankan migration lewat `docker compose run --rm web-migrate` (BUKAN
  # `exec web pnpm payload migrate`, seperti disebut docs/15-CICD.md — image
  # `web` yang jalan (final stage Dockerfile, `output: standalone`) sengaja
  # ramping dan tidak menyertakan pnpm/source lengkap, jadi tidak bisa
  # menjalankan CLI Payload. Service ini pakai stage `builder` yang masih
  # punya pnpm + source lengkap. Diverifikasi lokal (docker compose run
  # --rm web-migrate pnpm payload migrate:status) berhasil connect &
  # baca migration table.
  web-migrate:
    build:
      context: ../apps/web
      target: builder
    env_file: ../apps/web/.env
    depends_on:
      - postgres
    entrypoint: ['pnpm', 'payload']
    profiles: ['migrate']

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-bariskode.org}
      CTF_SUBDOMAIN: ${CTF_SUBDOMAIN:-ctf.bariskode.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - ctfd
    mem_limit: 96m
    <<: *default-logging

volumes:
  postgres_data:
  judge0_data:
  ctfd_uploads:
  ctfd_logs:
  ctfd_db_data:
  ctfd_redis_data:
  caddy_data:
  caddy_config:
